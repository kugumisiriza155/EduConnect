<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EduConnect Uganda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo"><a href="index.html">EduConnect</a></div>
            <ul class="nav-links">
                <li><a href="courses.html">Courses</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="index.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Profile Content -->
    <main class="profile-container">
        <!-- Profile Header -->
        <section class="profile-header">
            <div class="avatar">
                <img src="edu.avif" alt="Profile Picture">
                <button class="edit-avatar"><i class="fas fa-camera"></i></button>
            </div>
            <h1>Arthur</h1>
            <p class="role">Student</p>
            <p class="email">arthur@educonnect.ug</p>
        </section>

        <!-- Profile Details -->
        <div class="profile-content">
            <!-- Enrolled Courses -->
            <section class="enrolled-courses">
                <h2><i class="fas fa-book-open"></i> Enrolled Courses</h2>
                <div class="course-list">
                    <div class="course-item">
                        <h3>Web Development Basics</h3>
                        <p>Instructor: Jane Smith</p>
                        <a href="courses.html" class="course-link">Continue Learning</a>
                    </div>
                    <!-- Add more courses -->
                </div>
            </section>

            <!-- Account Settings -->
            <section class="account-settings">
                <h2><i class="fas fa-cog"></i> Account Settings</h2>
                <form class="profile-form">
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" value="Phenomeno One">
                    </div>
                    
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" value="pheno@educonnect.ug">
                    </div>

                    <div class="form-group">
                        <label>Change Password:</label>
                        <input type="password" placeholder="New Password">
                        <input type="password" placeholder="Confirm Password">
                    </div>

                    <button type="submit" class="save-btn">Save Changes</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 EduConnect Uganda</p>
    </footer>
</body>
</html>


<style>
    :root {
    --primary-color: #7A288A;
    --secondary-color: #4CAF50;
    --text-light: #FFFFFF;
    --text-dark: #333333;
    --background-light: #F5F5F5;
}

.profile-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 1rem;
}

.profile-header {
    text-align: center;
    padding: 2rem;
    background: var(--text-light);
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-bottom: 2rem;
}

.avatar {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 1rem;
}

.avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
}

.edit-avatar {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: var(--secondary-color);
    color: var(--text-light);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
}

.profile-header h1 {
    color: var(--primary-color);
    margin-bottom: 0.5rem;
}

.role {
    color: var(--secondary-color);
    font-weight: bold;
}

.profile-content {
    display: grid;
    grid-template-columns: 1fr;
    gap: 2rem;
}

.enrolled-courses, .account-settings {
    background: var(--text-light);
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.course-list {
    margin-top: 1rem;
}

.course-item {
    padding: 1rem;
    border: 1px solid #eee;
    border-radius: 8px;
    margin-bottom: 1rem;
}

.course-link {
    display: inline-block;
    background: var(--secondary-color);
    color: var(--text-light);
    padding: 0.5rem 1rem;
    border-radius: 5px;
    text-decoration: none;
    margin-top: 0.5rem;
}

.profile-form .form-group {
    margin-bottom: 1.5rem;
}

.profile-form label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text-dark);
}

.profile-form input {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid #ddd;
    border-radius: 5px;
    margin-bottom: 0.5rem;
}

.save-btn {
    background: var(--primary-color);
    color: var(--text-light);
    padding: 1rem 2rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;
}

/* Responsive Design */
@media (min-width: 768px) {
    .profile-content {
        grid-template-columns: 2fr 3fr;
    }
}

</style>
